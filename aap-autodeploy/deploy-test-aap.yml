---
- name: "Play 1 — Create VM from golden image"
  hosts: hypervisor
  become: true
  vars_files:
    - ../myvars
    - vars/main.yml
  vars:
    vm_suffix: test
    vmcounter_file: /opt/vms/vmcounter
    installer_tarball_name: "ansible-automation-platform-containerized-setup-bundle-{{ aap_version }}-x86_64.tar.gz"
    installer_dir_name: "ansible-automation-platform-containerized-setup-bundle-{{ aap_version }}-x86_64"

  tasks:
    - name: Read VM counter
      ansible.builtin.slurp:
        src: "{{ vmcounter_file }}"
      register: vmcounter_raw

    - name: Set VM name from counter
      ansible.builtin.set_fact:
        vm_counter: "{{ (vmcounter_raw.content | b64decode | trim) | int }}"
        vm_name: "aap{{ aap_version_short }}-{{ vm_suffix }}-{{ (vmcounter_raw.content | b64decode | trim) | int }}"

    - name: Copy golden image for VM
      ansible.builtin.copy:
        src: "{{ golden_image_path }}"
        dest: "{{ vm_dir }}/{{ vm_name }}.disk.qcow2"
        remote_src: true
        force: false

    - name: Resize VM disk
      ansible.builtin.command:
        cmd: "qemu-img resize {{ vm_dir }}/{{ vm_name }}.disk.qcow2 {{ aap_disk_size }}"

    - name: Customize VM image
      ansible.builtin.command:
        cmd: >-
          virt-customize -a {{ vm_dir }}/{{ vm_name }}.disk.qcow2
          --hostname {{ vm_name }}.{{ vault_domain }}
          --selinux-relabel

    - name: Create and start VM
      ansible.builtin.command:
        cmd: >-
          virt-install
          --name {{ vm_name }}
          --vcpus {{ aap_vcpus }}
          --memory {{ aap_memory_mb }}
          --import
          --graphics none
          --osinfo detect=on,require=off
          --disk path={{ vm_dir }}/{{ vm_name }}.disk.qcow2,format=qcow2
          --network network={{ vm_network }}
          --noautoconsole

    - name: Wait for VM to get DHCP lease
      ansible.builtin.command:
        cmd: "virsh net-dhcp-leases {{ vm_network }}"
      register: dhcp_leases
      until: dhcp_leases.stdout is search(vm_name)
      retries: 30
      delay: 5

    - name: Extract VM IP from DHCP leases
      ansible.builtin.set_fact:
        new_vm_ip: >-
          {{ dhcp_leases.stdout_lines
             | select('search', vm_name)
             | first
             | regex_search('(\d+\.\d+\.\d+\.\d+)')
          }}

    - name: Add new VM to in-memory inventory
      ansible.builtin.add_host:
        name: new_aap_vm
        ansible_host: "{{ new_vm_ip }}"
        ansible_user: ansible
        ansible_password: ansible
        ansible_become: true
        new_vm_ip: "{{ new_vm_ip }}"
        vm_name: "{{ vm_name }}"
        vm_counter: "{{ vm_counter }}"
        installer_tarball_name: "{{ installer_tarball_name }}"
        installer_dir_name: "{{ installer_dir_name }}"

    - name: Display VM IP
      ansible.builtin.debug:
        msg: "New VM {{ vm_name }} is at {{ new_vm_ip }}"

    - name: Increment VM counter
      ansible.builtin.copy:
        content: "{{ (vm_counter | int) + 1 }}"
        dest: "{{ vmcounter_file }}"
        mode: "0644"


- name: "Play 2 — Prepare host for AAP installation"
  hosts: new_aap_vm
  become: true
  gather_facts: false
  vars_files:
    - ../myvars
    - vars/main.yml

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Grow root filesystem
      block:
        - name: Grow partition
          ansible.builtin.command:
            cmd: growpart /dev/sda 4
          failed_when: false

        - name: Grow XFS filesystem
          ansible.builtin.command:
            cmd: xfs_growfs /
          failed_when: false

    - name: Create aap_service user
      ansible.builtin.user:
        name: aap_service
        create_home: true
        shell: /bin/bash

    - name: Grant aap_service sudo
      ansible.builtin.copy:
        content: "aap_service ALL=(ALL) NOPASSWD: ALL"
        dest: /etc/sudoers.d/aap_service
        mode: "0440"

    - name: Enable linger for aap_service
      ansible.builtin.command:
        cmd: loginctl enable-linger aap_service

    - name: Subscribe to RHEL and enable AAP repository
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.rhc
      vars:
        rhc_state: present
        rhc_auth:
          activation_keys:
            keys:
              - "{{ vault_rhsm_activation_key }}"
            org_id: "{{ vault_rhsm_org_id }}"
        rhc_repositories:
          - name: ansible-automation-platform-2.7-for-rhel-9-x86_64-rpms
            state: enabled

    - name: Install ansible-core
      ansible.builtin.dnf:
        name: ansible-core
        state: present

    - name: Unsubscribe from RHEL
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.rhc
      vars:
        rhc_state: absent

    - name: Create installer directory
      ansible.builtin.file:
        path: "{{ installer_extract_dir }}"
        state: directory
        owner: aap_service
        group: aap_service
        mode: "0755"


- name: "Play 3 — Copy installer and deploy AAP"
  hosts: new_aap_vm
  become: true
  become_user: aap_service
  gather_facts: false
  vars_files:
    - ../myvars
    - vars/main.yml
  vars:
    aap_hostname: "{{ hostvars['new_aap_vm']['vm_name'] }}.{{ vault_domain }}"
    source_aap_fqdn: "aap.{{ vault_domain }}"
    installer_tarball_name: "{{ hostvars['new_aap_vm']['installer_tarball_name'] }}"
    installer_dir_name: "{{ hostvars['new_aap_vm']['installer_dir_name'] }}"

  tasks:
    - name: Copy installer tarball from source AAP
      ansible.posix.synchronize:
        src: "{{ installer_path }}"
        dest: "{{ installer_extract_dir }}/"
      delegate_to: "{{ source_aap_host }}"

    - name: Extract installer tarball
      ansible.builtin.unarchive:
        src: "{{ installer_extract_dir }}/{{ installer_tarball_name }}"
        dest: "{{ installer_extract_dir }}/"
        remote_src: true

    - name: Copy inventory from source AAP
      ansible.builtin.command:
        cmd: >-
          scp -o StrictHostKeyChecking=no
          {{ source_aap_host }}:{{ installer_extract_dir }}/{{ installer_dir_name }}/inventory
          {{ installer_extract_dir }}/{{ installer_dir_name }}/inventory
      become: false

    - name: Replace hostname in inventory
      ansible.builtin.replace:
        path: "{{ installer_extract_dir }}/{{ installer_dir_name }}/inventory"
        regexp: "{{ source_aap_fqdn }}"
        replace: "{{ aap_hostname }}"

    - name: Set bundle install in inventory
      ansible.builtin.lineinfile:
        path: "{{ installer_extract_dir }}/{{ installer_dir_name }}/inventory"
        line: "{{ item }}"
        insertafter: '\[all:vars\]'
      loop:
        - "bundle_install=true"
        - "bundle_dir={{ installer_extract_dir }}/{{ installer_dir_name }}"

    - name: Run AAP installer
      ansible.builtin.command:
        cmd: ansible-playbook -i inventory ansible.containerized_installer.install
        chdir: "{{ installer_extract_dir }}/{{ installer_dir_name }}"
      async: 3600
      poll: 30

    - name: Verify AAP is accessible
      ansible.builtin.uri:
        url: "https://localhost/api/controller/v2/ping/"
        validate_certs: false
      register: aap_ping
      retries: 12
      delay: 10
      until: aap_ping.status == 200


- name: "Play 4 — Create DNS record and configure nginx reverse proxy"
  hosts: hypervisor
  become: true
  vars_files:
    - ../myvars
    - vars/main.yml
  vars:
    new_vm_ip: "{{ hostvars['new_aap_vm']['new_vm_ip'] }}"
    aap_test_subdomain: "{{ hostvars['new_aap_vm']['vm_name'] }}"

  tasks:
    - name: Create GoDaddy DNS A record
      ansible.builtin.uri:
        url: "https://api.godaddy.com/v1/domains/{{ vault_domain }}/records/A/{{ aap_test_subdomain }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ vault_godaddy_api_token }}"
        body_format: json
        body:
          - data: "{{ vault_public_ip }}"
            ttl: 600
        status_code: 200
      become: false

    - name: Template nginx config
      ansible.builtin.template:
        src: templates/nginx-aap-test.conf.j2
        dest: "/etc/nginx/conf.d/{{ aap_test_subdomain }}.conf"
        mode: "0644"
      notify: reload nginx

  handlers:
    - name: reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
