---
- name: Require one consistent protected target and valid guest identity
  ansible.builtin.assert:
    that:
      - __generic_linux_vm_target_hosts | length == 1
      - linux_vm_deployment_name is match('^[a-z][a-z0-9-]{0,62}$')
      - linux_vm_hostname is string
      - linux_vm_hostname | length <= 253
      - >-
        linux_vm_hostname is match(
          '^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?[.])*[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
      - vm_vcpus | default(2) | int >= 1
      - vm_memory_mb | default(4096) | int >= 1024
      - vm_disk_gb | default(provisioning.vm_disk_gb | default(20)) | int >= 1
      - provisioning.golden_image_path is abs
      - provisioning.vm_dir is abs
      - provisioning.vm_domain | length > 0
      - provisioning.vm_network | length > 0
      - provisioning.generic_image | default(false) is boolean
      - provisioning.source_image_sha256 is match('^[0-9a-f]{64}$')
      - provisioning.network_bridge is match('^[A-Za-z0-9_.-]{1,15}$')
      - >-
        provisioning.hypervisor_pin | linux_vm_recovery_pin(
          hostvars[__generic_linux_vm_target_hosts[0]].ansible_host | default(__generic_linux_vm_target_hosts[0])) is mapping
    fail_msg: Supply one matching protected hypervisor route and valid VM resources, image hash and guest hostname.
    quiet: true
  no_log: true
