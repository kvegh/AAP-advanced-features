---
# Deploy Ansible Automation Portal on OpenShift and connect it to AAP.
#
# Prerequisites:
#   - pip install kubernetes openshift
#   - ansible-galaxy collection install kubernetes.core
#   - oc CLI and helm 3.10+ on PATH
#   - Copy vars/portal-config.yml.example → vars/portal-config.yml
#
# Usage:
#   ansible-playbook deploy-automation-portal.yml

- name: Deploy Ansible Automation Portal
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/portal-config.yml

  module_defaults:
    group/kubernetes.core.all:
      host: "{{ ocp_api_url | default(omit) }}"
      api_key: "{{ ocp_token | default(omit) }}"
      kubeconfig: "{{ ocp_kubeconfig | default(omit) }}"
      validate_certs: "{{ ocp_validate_certs | default(true) }}"

  pre_tasks:

    - name: Look up AAP organization ID
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/organizations/?name={{ aap_organization | urlencode }}"
        method: GET
        user: "{{ aap_admin_user }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: _org_lookup

    - name: Fail if organization not found
      ansible.builtin.assert:
        that: _org_lookup.json.count > 0
        fail_msg: "Organization '{{ aap_organization }}' not found in AAP."

    - name: Set organization ID
      ansible.builtin.set_fact:
        _org_id: "{{ _org_lookup.json.results[0].id }}"

  tasks:

    # =================================================================
    # Phase 1 — AAP: OAuth Application + API Token
    # =================================================================

    - name: Create OAuth Application in AAP
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/gateway/v1/o/applications/"
        method: POST
        user: "{{ aap_admin_user }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        body:
          name: "automation-portal"
          organization: "{{ _org_id }}"
          authorization_grant_type: "authorization-code"
          client_type: "confidential"
          redirect_uris: "https://placeholder.example.com"
        status_code: [201, 400]
      register: _oauth_create

    - name: Retrieve existing OAuth Application (if already exists)
      when: _oauth_create.status == 400
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/gateway/v1/o/applications/?name=automation-portal"
        method: GET
        user: "{{ aap_admin_user }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: _oauth_existing

    - name: Set OAuth facts (new app)
      when: _oauth_create.status == 201
      ansible.builtin.set_fact:
        oauth_client_id: "{{ _oauth_create.json.client_id }}"
        oauth_client_secret: "{{ _oauth_create.json.client_secret }}"
        oauth_app_id: "{{ _oauth_create.json.id }}"

    - name: Set OAuth facts (existing app)
      when: _oauth_create.status == 400
      ansible.builtin.set_fact:
        oauth_client_id: "{{ _oauth_existing.json.results[0].client_id }}"
        oauth_client_secret: "{{ _oauth_existing.json.results[0].client_secret }}"
        oauth_app_id: "{{ _oauth_existing.json.results[0].id }}"

    - name: Enable external OAuth2 token creation
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/gateway/v1/settings/"
        method: PATCH
        user: "{{ aap_admin_user }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        body:
          ALLOW_OAUTH2_FOR_EXTERNAL_USERS: true
        status_code: [200, 204]
      failed_when: false

    - name: Create API token for portal
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/gateway/v1/tokens/"
        method: POST
        user: "{{ aap_admin_user }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        body:
          description: "Automation Portal"
          application: "{{ oauth_app_id }}"
          scope: "write"
        status_code: [201]
      register: _token_create

    - name: Save API token
      ansible.builtin.set_fact:
        aap_api_token: "{{ _token_create.json.token }}"

    - name: Display OAuth credentials
      ansible.builtin.debug:
        msg:
          - "OAuth Client ID:     {{ oauth_client_id }}"
          - "OAuth Client Secret: {{ oauth_client_secret }}"
          - "API Token:           {{ aap_api_token }}"

    # =================================================================
    # Phase 2 — OpenShift: Project + Secrets
    # =================================================================

    - name: Create OpenShift project
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: project.openshift.io/v1
          kind: ProjectRequest
          metadata:
            name: "{{ ocp_project }}"
      register: _project_result
      failed_when:
        - _project_result is failed
        - "'AlreadyExists' not in (_project_result.msg | default(''))"

    - name: Create AAP authentication secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: secrets-rhaap-portal
            namespace: "{{ ocp_project }}"
          type: Opaque
          stringData:
            aap-host-url: "{{ aap_host }}"
            oauth-client-id: "{{ oauth_client_id }}"
            oauth-client-secret: "{{ oauth_client_secret }}"
            aap-token: "{{ aap_api_token }}"

    - name: Create OCI plugin registry auth secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ helm_release_name }}-dynamic-plugins-registry-auth"
            namespace: "{{ ocp_project }}"
          type: Opaque
          stringData:
            auth.json: |
              {
                "auths": {
                  "registry.redhat.io": {
                    "auth": "{{ (registry_username + ':' + registry_password) | b64encode }}"
                  }
                }
              }

    - name: Create SCM secret
      when: (github_token is defined and github_token | length > 0) or
            (gitlab_token is defined and gitlab_token | length > 0)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: secrets-scm
            namespace: "{{ ocp_project }}"
          type: Opaque
          stringData: "{{ _scm_data }}"
      vars:
        _scm_data: >-
          {{
            {}
            | combine({'github-token': github_token} if (github_token is defined and github_token | length > 0) else {})
            | combine({'gitlab-token': gitlab_token} if (gitlab_token is defined and gitlab_token | length > 0) else {})
          }}

    # =================================================================
    # Phase 3 — Helm chart install
    # =================================================================

    - name: Template Helm values
      ansible.builtin.template:
        src: templates/helm-values.yml.j2
        dest: /tmp/automation-portal-values.yml
        mode: "0600"

    - name: Log in to OCP with oc (for Helm)
      when: ocp_kubeconfig is not defined
      ansible.builtin.command:
        cmd: >-
          oc login {{ ocp_api_url }}
          --token={{ ocp_token }}
          {% if not (ocp_validate_certs | default(true)) %}--insecure-skip-tls-verify{% endif %}
      changed_when: true
      no_log: true

    - name: Add Helm chart repository
      kubernetes.core.helm_repository:
        name: openshift-helm-charts
        repo_url: "{{ helm_chart_repo }}"

    - name: Install Automation Portal Helm chart
      kubernetes.core.helm:
        name: "{{ helm_release_name }}"
        chart_ref: "{{ helm_chart_name }}"
        chart_version: "{{ helm_chart_version | default(omit) }}"
        release_namespace: "{{ ocp_project }}"
        values_files:
          - /tmp/automation-portal-values.yml
        wait: true
        wait_timeout: "600s"

    # =================================================================
    # Phase 4 — Post-install: wire up the OAuth redirect URI
    # =================================================================

    - name: Wait for portal route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ ocp_project }}"
      register: _routes
      retries: 30
      delay: 10
      until: _routes.resources | length > 0

    - name: Set portal URL facts
      ansible.builtin.set_fact:
        portal_url: "https://{{ _routes.resources[0].spec.host }}"
        portal_redirect_uri: "https://{{ _routes.resources[0].spec.host }}/api/auth/rhaap/handler/frame"

    - name: Update OAuth redirect URI in AAP
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/gateway/v1/o/applications/{{ oauth_app_id }}/"
        method: PATCH
        user: "{{ aap_admin_user }}"
        password: "{{ aap_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        body:
          redirect_uris: "{{ portal_redirect_uri }}"
        status_code: [200]

    - name: Clean up temp file
      ansible.builtin.file:
        path: /tmp/automation-portal-values.yml
        state: absent

    - name: Deployment complete
      ansible.builtin.debug:
        msg:
          - "Automation Portal deployed successfully."
          - "URL: {{ portal_url }}"
          - "Sign in with your AAP credentials."
